<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAPTCHA practice</title>
<style>
  :root { color-scheme: light dark; --surface: #fcfdfc; --canvas: #f3f5f4; --text: #293c31; --muted: #65756b; --line: #d3ddd6; }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); background: var(--canvas); font: 14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { width: min(440px,calc(100% - 40px)); margin: 234px auto 30px; padding: 24px 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
  h1 { font-size: 19px; line-height: 1.4; margin: 0 0 8px; font-weight: 600; }
  p { margin: 0 0 22px; color: var(--muted); }
  form { display: flex; flex-direction: column; align-items: start; gap: 14px; }
  img { width: 170px; height: 51px; margin: 5px 0 12px; }
  label { width: 100%; font-size: 12px; color: var(--muted); }
  input { display: block; margin-top: 7px; height: 40px; width: 100%; padding: 0 12px; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 7px; font: 15px inherit; }
  @media(prefers-color-scheme:dark) { :root { --surface:#222b25; --canvas:#171d19; --text:#edf3ef; --muted:#afbeb4; --line:#415147; } }
</style>
<main>
  <h1>Confirm your request</h1>
  <p>Enter the code shown below to continue.</p>
  <form><img id="sample" src="/fixtures/digits-002.png" alt=""><label><span>Verification code</span><input id="answer" autocomplete="off"></label></form>
</main>
<script>
  if(new URLSearchParams(location.search).get('lang')==='zh') {
    document.documentElement.lang='zh-CN';
    document.querySelector('h1').textContent='确认你的操作';
    document.querySelector('p').textContent='输入图片中的验证码，即可继续。';
    document.querySelector('label span').textContent='验证码';
  }
  document.querySelector('form').addEventListener('submit', event=>event.preventDefault());
</script>
</html>
